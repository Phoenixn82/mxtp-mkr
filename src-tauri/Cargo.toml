[package]
name = "mxtp_mkr"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "mxtp_mkr"
path = "src/lib.rs"

[[bin]]
name = "mxtp-mkr"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
flate2 = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tempfile = "3"
urlencoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_Imapi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
